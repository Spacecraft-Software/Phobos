#
# CI (PLAN.md P-010, P-012). Every gate in AGENTS.md runs here.
#
#   gates     fmt, clippy -D warnings, tests, docs (warnings are errors)
#   audit     cargo-deny (licences, bans incl. crate direction), cargo-audit
#   posture   REUSE lint, the §6.5 CR-byte check on the index
#   oracle    test data checksums, Chocolate Doom headless smoke run

name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97.1"

permissions:
  contents: read

jobs:
  gates:
    name: fmt · clippy · test · doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  audit:
    name: cargo-deny · cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  posture:
    name: REUSE · text format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5
      - name: no CR bytes in any indexed text file (Standard §6.5)
        run: |
          bad=$(git ls-files --eol | awk '$1 ~ /^i\/(crlf|mixed)$/ { print $NF }')
          if [ -n "$bad" ]; then echo "CRLF in: $bad"; exit 1; fi

  oracle:
    name: test data · oracle smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command tools/testdata-check.sh
      - run: nix develop --command tools/oracle-smoke.sh
