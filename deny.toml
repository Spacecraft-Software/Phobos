#
# cargo-deny policy (Standard §24: audit tooling for Category D).
#
# [licenses] admits GPL-3.0-compatible licences only
#            (/spacecraft-software/license/ALLOWED_LICENSES.md).
# [bans]     also enforces the crate dependency rules of PRD.md, "Crate
#            layout": a `wrappers` list names the only crates allowed to
#            depend on that crate directly.

[graph]
all-features = true

[licenses]
allow = [
  "GPL-3.0-or-later",
  "GPL-2.0-or-later",
  "LGPL-2.1-or-later",
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
]
confidence-threshold = 0.9

[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

# The simulation reads decoded data, never the archive: only game flow and the
# two executables open WADs.
[[bans.deny]]
name = "phobos-wad"
wrappers = ["phobos-game", "phobos-app", "phobos-tools"]

# The simulation depends on nothing but phobos-fixed and phobos-data, so no
# presentation crate may be pulled in beneath it.
[[bans.deny]]
name = "phobos-render"
wrappers = ["phobos-ui", "phobos-gpu", "phobos-app", "phobos-tools"]

[[bans.deny]]
name = "phobos-audio"
wrappers = ["phobos-app"]

[[bans.deny]]
name = "phobos-gpu"
wrappers = ["phobos-app"]

# Windowing and GPU belong to the app and the presenter only.
[[bans.deny]]
name = "winit"
wrappers = ["phobos-app", "phobos-gpu"]

[[bans.deny]]
name = "wgpu"
wrappers = ["phobos-gpu"]

[[bans.deny]]
name = "softbuffer"
wrappers = ["phobos-gpu"]

[[bans.deny]]
name = "cpal"
wrappers = ["phobos-audio"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
